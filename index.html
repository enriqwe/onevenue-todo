<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d14;
      --panel: #111827;
      --panel-2: #0d1420;
      --panel-3: #172033;
      --ink: #e5e7eb;
      --muted: #94a3b8;
      --line: #263244;
      --blue: #60a5fa;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #fb7185;
      --shadow: 0 22px 70px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 16px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 4px 0 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle { display: none; }

    .header-actions,
    .toolbar-actions,
    .task-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      min-height: 36px;
      padding: 8px 11px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 750;
      box-shadow: 0 1px 0 rgba(255,255,255,.05) inset;
      line-height: 1.15;
      text-align: center;
    }

    .button.primary { background: var(--blue); color: #07111f; border-color: var(--blue); }
    .button.danger { color: var(--red); }
    .icon-button { width: 34px; padding: 0; }
    .button:disabled { opacity: .42; cursor: not-allowed; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin: 8px 0 12px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      outline: none;
    }

    .search:focus,
    .composer input:focus,
    .composer textarea:focus,
    .composer select:focus,
    .task-dialog input:focus,
    .task-dialog textarea:focus,
    .task-dialog select:focus {
      border-color: #8bb8ff;
      box-shadow: 0 0 0 4px rgba(23,105,224,.12);
    }

    .composer {
      margin: 0;
    }

    .composer-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 150px 150px auto;
      gap: 10px;
      align-items: start;
    }

    .composer input,
    .composer textarea,
    .composer select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 12px;
      outline: none;
    }

    .composer textarea {
      min-height: 42px;
      resize: vertical;
      line-height: 1.35;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .column {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 240px;
      padding: 10px;
    }

    .column-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 4px 2px;
    }

    .column h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .count {
      min-width: 28px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .task-list { display: grid; gap: 9px; min-height: 240px; }

    .task {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      padding: 11px 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
      cursor: pointer;
    }

    .task:hover { border-color: #3b4a60; background: #151f2f; }

    .task[data-priority="critica"] { border-left-color: var(--red); }
    .task[data-priority="alta"] { border-left-color: #f97316; }
    .task[data-priority="media"] { border-left-color: var(--amber); }
    .task[data-priority="baja"] { border-left-color: var(--green); }
    .task.done { opacity: .7; }
    .task.done .task-title { text-decoration: line-through; color: var(--muted); }

    .task-main {
      position: relative;
      padding-right: 34px;
    }

    .delete-task {
      position: absolute;
      top: -3px;
      right: -2px;
      width: 28px;
      min-height: 28px;
      border: 0;
      background: transparent;
      color: var(--muted);
      box-shadow: none;
      font-size: 18px;
      line-height: 1;
    }

    .delete-task:hover { color: var(--red); background: #25131b; }

    .priority-select {
      position: absolute;
      top: -1px;
      right: 29px;
      width: 24px;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: transparent;
      background: var(--priority-color, var(--amber));
      appearance: none;
      outline: none;
      padding: 0;
      cursor: pointer;
    }

    .priority-select:focus {
      box-shadow: 0 0 0 3px rgba(96, 165, 250, .2);
    }

    .priority-select option {
      color: var(--ink);
      background: var(--panel);
    }

    .task[data-priority="critica"] .priority-select { --priority-color: var(--red); }
    .task[data-priority="alta"] .priority-select { --priority-color: #f97316; }
    .task[data-priority="media"] .priority-select { --priority-color: var(--amber); }
    .task[data-priority="baja"] .priority-select { --priority-color: var(--green); }

    .task-title {
      margin: 0;
      font-weight: 850;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .task-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .task-summary {
      margin: 7px 0 0;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--panel-3);
      border-radius: 999px;
      padding: 4px 7px;
      font-weight: 750;
    }

    .tag-field {
      position: relative;
      display: grid;
      gap: 7px;
    }

    .tag-preview,
    .tag-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-chip {
      border: 1px solid var(--line);
      background: var(--panel-3);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.1;
    }

    .tag-chip.new {
      border-color: rgba(251, 191, 36, .55);
      background: rgba(251, 191, 36, .13);
      color: #fde68a;
    }

    .tag-suggestions {
      min-height: 28px;
    }

    .tag-suggestion {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 999px;
      min-height: 28px;
      padding: 5px 9px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
    }

    .tag-suggestion:hover,
    .tag-suggestion:focus {
      border-color: var(--blue);
      outline: none;
    }

    .tag-empty {
      color: var(--muted);
      font-size: 12px;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
    }

    .empty {
      border: 1px dashed #334155;
      border-radius: 8px;
      color: var(--muted);
      min-height: 84px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 12px;
      font-size: 14px;
    }

    .file-input { display: none; }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .62);
      z-index: 20;
    }

    .dialog-backdrop.open { display: flex; }

    .task-dialog {
      width: min(760px, 100%);
      max-height: min(860px, calc(100vh - 36px));
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .dialog-head,
    .dialog-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-actions {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .dialog-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .dialog-body {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .task-dialog input,
    .task-dialog textarea,
    .task-dialog select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 12px;
      outline: none;
    }

    .dialog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .detail-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .summary-editor {
      min-height: 96px;
      resize: vertical;
      line-height: 1.45;
    }

    .detail-preview {
      min-height: 92px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 8px;
      padding: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .detail-editor {
      min-height: 190px;
      resize: vertical;
      line-height: 1.45;
    }

    .voice-active {
      background: #3a1721;
      border-color: #9f1239;
      color: var(--red);
    }

    @media (max-width: 980px) {
      header, .toolbar { grid-template-columns: 1fr; align-items: stretch; }
      .header-actions, .toolbar-actions { justify-content: flex-start; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .composer-grid { grid-template-columns: 1fr 1fr; }
      .composer-grid .wide { grid-column: 1 / -1; }
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      body { overflow-x: hidden; }
      .app { width: calc(100vw - 20px); padding-top: 14px; }
      .stats, .board, .composer-grid { grid-template-columns: 1fr; }
      .dialog-grid { grid-template-columns: 1fr; }
      .header-actions, .toolbar-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .header-actions .button, .toolbar-actions .button { min-width: 0; padding-left: 8px; padding-right: 8px; }
      .column { min-height: 240px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Notas</h1>
        <p class="subtitle">Notas de trabajo.</p>
      </div>
      <div class="header-actions">
        <button class="button primary" id="newNoteBtn" type="button">Nueva nota</button>
      </div>
    </header>

    <section class="toolbar" aria-label="Filtros">
      <input class="search" id="search" type="search" placeholder="Buscar: keyword, tag:KPIs, priority:media, status:ahora">
      <div class="toolbar-actions">
        <button class="button" type="button" data-filter="open">Abiertas</button>
        <button class="button" type="button" data-filter="done">Hechas</button>
        <button class="button" type="button" data-filter="all">Todas</button>
        <button class="button danger" id="clearDoneBtn" type="button">Limpiar hechas</button>
      </div>
    </section>

    <section class="board" id="board" aria-label="Notas"></section>
  </main>

  <div class="dialog-backdrop" id="newNoteDialog" role="dialog" aria-modal="true" aria-labelledby="newNoteTitle">
    <section class="task-dialog">
      <div class="dialog-head">
        <h2 class="dialog-title" id="newNoteTitle">Nueva nota</h2>
        <button class="button icon-button" id="closeNewNoteBtn" type="button" title="Cerrar">×</button>
      </div>
      <form class="composer" id="taskForm">
        <div class="dialog-body">
          <div class="field">
            <label for="title">Título</label>
            <textarea id="title" rows="2" required></textarea>
          </div>
          <div class="dialog-grid">
            <div class="field">
              <label for="priority">Importancia</label>
              <select id="priority" aria-label="Importancia">
                <option value="critica">Critica</option>
                <option value="alta">Alta</option>
                <option value="media" selected>Media</option>
                <option value="baja">Baja</option>
              </select>
            </div>
            <div class="field">
              <label for="status">Estado</label>
              <select id="status" aria-label="Estado">
                <option value="ahora" selected>Ahora</option>
                <option value="siguiente">Siguiente</option>
                <option value="espera">En espera</option>
              </select>
            </div>
          </div>
          <div class="field">
            <div class="detail-toolbar">
              <label for="note">Resumen</label>
              <div class="toolbar-actions">
                <button class="button" id="toggleNewSummaryBtn" type="button">Anadir resumen</button>
                <button class="button" id="generateNewSummaryBtn" type="button">Generar</button>
              </div>
            </div>
            <textarea class="summary-editor" id="note" hidden></textarea>
          </div>
          <div class="field">
            <label for="tags">Tags</label>
            <div class="tag-field">
              <input id="tags" type="text" placeholder="KPIs, alertas, ETL" autocomplete="off">
              <div class="tag-preview" id="tagsPreview"></div>
              <div class="tag-suggestions" id="tagsSuggestions"></div>
            </div>
          </div>
          <div class="field">
            <div class="detail-toolbar">
              <label for="newDetail">Descripción</label>
              <button class="button" id="newVoiceBtn" type="button" title="Dictar descripción">Dictar</button>
            </div>
            <textarea class="detail-editor" id="newDetail"></textarea>
          </div>
        </div>
        <div class="dialog-actions">
          <button class="button" id="cancelNewNoteBtn" type="button">Cancelar</button>
          <button class="button primary" type="submit">Guardar</button>
        </div>
      </form>
    </section>
  </div>

  <div class="dialog-backdrop" id="taskDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTaskTitle">
    <section class="task-dialog">
      <div class="dialog-head">
        <h2 class="dialog-title" id="dialogTaskTitle">Detalle de nota</h2>
        <button class="button icon-button" id="closeDialogBtn" type="button" title="Cerrar">×</button>
      </div>
      <div class="dialog-body">
        <div class="field">
          <label for="dialogTitle">Nota</label>
          <textarea id="dialogTitle" rows="2"></textarea>
        </div>
        <div class="dialog-grid">
          <div class="field">
            <label for="dialogPriority">Importancia</label>
            <select id="dialogPriority">
              <option value="critica">Critica</option>
              <option value="alta">Alta</option>
              <option value="media">Media</option>
              <option value="baja">Baja</option>
            </select>
          </div>
          <div class="field">
            <label for="dialogStatus">Estado</label>
            <select id="dialogStatus">
              <option value="ahora">Ahora</option>
              <option value="siguiente">Siguiente</option>
              <option value="espera">En espera</option>
              <option value="hecho">Hecho</option>
            </select>
          </div>
        </div>
        <div class="field">
          <div class="detail-toolbar">
            <label for="dialogNote">Resumen</label>
            <div class="toolbar-actions">
              <button class="button" id="toggleDialogSummaryBtn" type="button">Anadir resumen</button>
              <button class="button" id="generateDialogSummaryBtn" type="button">Generar</button>
            </div>
          </div>
          <textarea class="summary-editor" id="dialogNote" hidden></textarea>
        </div>
        <div class="field">
          <label for="dialogTags">Tags</label>
          <div class="tag-field">
            <input id="dialogTags" type="text" placeholder="KPIs, ventas, producto" autocomplete="off">
            <div class="tag-preview" id="dialogTagsPreview"></div>
            <div class="tag-suggestions" id="dialogTagsSuggestions"></div>
          </div>
        </div>
        <div class="field">
          <div class="detail-toolbar">
            <label for="dialogDetail">Detalle completo</label>
            <div class="toolbar-actions">
              <button class="button" id="togglePreviewBtn" type="button">Ver detalle</button>
              <button class="button" id="voiceBtn" type="button" title="Dictar detalle">Dictar</button>
            </div>
          </div>
          <div class="detail-preview" id="detailPreview"></div>
          <textarea class="detail-editor" id="dialogDetail"></textarea>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="button danger" id="deleteDialogBtn" type="button">Eliminar</button>
        <button class="button" id="cancelDialogBtn" type="button">Cancelar</button>
        <button class="button primary" id="saveDialogBtn" type="button">Guardar</button>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "onevenue.todo.v1";
    const API_URL = "/api/onevenue-todo/tasks";
    const columns = [
      { id: "ahora", title: "Ahora" },
      { id: "siguiente", title: "Siguiente" },
      { id: "espera", title: "En espera" },
      { id: "hecho", title: "Hecho" }
    ];
    const priorityLabels = { critica: "Critica", alta: "Alta", media: "Media", baja: "Baja" };
    const validPriorities = Object.keys(priorityLabels);

    let tasks = loadTasks();
    let filter = "open";
    let query = "";
    let apiAvailable = false;
    let activeTaskId = null;
    let activeDialog = "";
    let detailMode = "summary";
    let recognition = null;
    let recognizing = false;
    let voiceBaseDetail = "";

    const board = document.querySelector("#board");
    const form = document.querySelector("#taskForm");
    const newNoteDialog = document.querySelector("#newNoteDialog");
    const newNoteBtn = document.querySelector("#newNoteBtn");
    const search = document.querySelector("#search");
    const titleInput = document.querySelector("#title");
    const noteInput = document.querySelector("#note");
    const toggleNewSummaryBtn = document.querySelector("#toggleNewSummaryBtn");
    const generateNewSummaryBtn = document.querySelector("#generateNewSummaryBtn");
    const tagsInput = document.querySelector("#tags");
    const tagsPreview = document.querySelector("#tagsPreview");
    const tagsSuggestions = document.querySelector("#tagsSuggestions");
    const newDetailInput = document.querySelector("#newDetail");
    const newVoiceBtn = document.querySelector("#newVoiceBtn");
    const priorityInput = document.querySelector("#priority");
    const statusInput = document.querySelector("#status");
    const taskDialog = document.querySelector("#taskDialog");
    const dialogTitle = document.querySelector("#dialogTitle");
    const dialogPriority = document.querySelector("#dialogPriority");
    const dialogStatus = document.querySelector("#dialogStatus");
    const dialogNote = document.querySelector("#dialogNote");
    const toggleDialogSummaryBtn = document.querySelector("#toggleDialogSummaryBtn");
    const generateDialogSummaryBtn = document.querySelector("#generateDialogSummaryBtn");
    const dialogTags = document.querySelector("#dialogTags");
    const dialogTagsPreview = document.querySelector("#dialogTagsPreview");
    const dialogTagsSuggestions = document.querySelector("#dialogTagsSuggestions");
    const dialogDetail = document.querySelector("#dialogDetail");
    const detailPreview = document.querySelector("#detailPreview");
    const togglePreviewBtn = document.querySelector("#togglePreviewBtn");
    const voiceBtn = document.querySelector("#voiceBtn");

    function loadTasks() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      if (apiAvailable) {
        fetch(API_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tasks })
        }).catch(() => {
          apiAvailable = false;
        });
      }
    }

    async function syncFromServer() {
      try {
        const response = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        if (!response.ok) return;
        const data = await response.json();
        if (!Array.isArray(data.tasks)) return;
        apiAvailable = true;
        tasks = data.tasks;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        render();
      } catch {
        apiAvailable = false;
      }
    }

    function id() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function filteredTasks(status) {
      const searchSpec = parseSearch(query);
      return tasks
        .filter((task) => task.status === status)
        .filter((task) => {
          if (filter === "open" && task.status === "hecho") return false;
          if (filter === "done" && task.status !== "hecho") return false;
          return matchesSearch(task, searchSpec);
        })
        .sort((a, b) => a.rank - b.rank);
    }

    function render() {
      const searchSpec = parseSearch(query);
      const visibleColumns = columns.filter((column) => {
        if (searchSpec.status) return column.id === searchSpec.status;
        if (filter === "open") return column.id !== "hecho";
        if (filter === "done") return column.id === "hecho";
        return true;
      });
      board.innerHTML = visibleColumns.map((column) => {
        const items = filteredTasks(column.id);
        return `
          <article class="column" data-column="${column.id}">
            <div class="column-head">
              <h2>${column.title}</h2>
              <span class="count">${items.length}</span>
            </div>
            <div class="task-list">
              ${items.length ? items.map(taskTemplate).join("") : `<div class="empty">Sin notas</div>`}
            </div>
          </article>
        `;
      }).join("");
      updateTagAssist(tagsInput);
      updateTagAssist(dialogTags);
    }

    function taskTemplate(task) {
      const done = task.status === "hecho";
      const summary = task.note ? "" : taskSummary(task);
      return `
        <article class="task ${done ? "done" : ""}" data-id="${task.id}" data-priority="${task.priority}">
          <div class="task-main">
            <div>
              <p class="task-title">${escapeHtml(task.title)}</p>
              ${task.note ? `<p class="task-note">${escapeHtml(task.note)}</p>` : ""}
              ${summary ? `<p class="task-summary">${escapeHtml(summary)}</p>` : ""}
              <div class="meta">
                ${normalizeTags(task.tags).map((tag) => `<span class="pill">#${escapeHtml(tag)}</span>`).join("")}
              </div>
            </div>
            <select class="priority-select" data-action="priority" title="Importancia" aria-label="Importancia">
              ${validPriorities.map((priority) => `<option value="${priority}" ${task.priority === priority ? "selected" : ""}>${priorityLabels[priority]}</option>`).join("")}
            </select>
            <button class="button danger icon-button delete-task" type="button" data-action="delete" title="Eliminar">×</button>
          </div>
        </article>
      `;
    }

    function taskSummary(task) {
      const text = String(task.note || task.detail || "").replace(/\s+/g, " ").trim();
      if (!text) return "";
      if (text.length <= 120) return text;
      return `${text.slice(0, 117).trim()}...`;
    }

    function generatedSummaryFromDetail(value) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (!text) return "";
      const sentences = text.match(/[^.!?]+[.!?]?/g) || [text];
      let summary = "";
      for (const sentence of sentences) {
        const next = [summary, sentence.trim()].filter(Boolean).join(" ");
        if (next.length > 220) break;
        summary = next;
        if (summary.length >= 120) break;
      }
      if (!summary) summary = text.slice(0, 220).trim();
      if (summary.length < text.length && !/[.!?]$/.test(summary)) summary = `${summary.replace(/[,.:\s]+$/, "")}...`;
      return summary;
    }

    function setSummaryVisibility(input, button, visible) {
      const show = Boolean(visible || input.value.trim());
      input.hidden = !show;
      button.textContent = show ? "Ocultar resumen" : "Anadir resumen";
    }

    function toggleSummary(input, button) {
      setSummaryVisibility(input, button, input.hidden);
      if (!input.hidden) input.focus();
    }

    function generateSummary(input, detailInput, button) {
      const summary = generatedSummaryFromDetail(detailInput.value);
      if (!summary) {
        alert("Necesito detalle para generar el resumen.");
        return;
      }
      input.value = summary;
      setSummaryVisibility(input, button, true);
      input.focus();
      if (input === dialogNote) updateDetailPreview();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function normalizeTags(value) {
      const source = Array.isArray(value) ? value : String(value || "").split(/[,;\n]/);
      const seen = new Set();
      return source
        .map((tag) => String(tag || "").trim())
        .filter((tag) => {
          const key = tag.toLowerCase();
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .slice(0, 12);
    }

    function tagsText(value) {
      return normalizeTags(value).join(", ");
    }

    function knownTags() {
      const byKey = new Map();
      tasks.forEach((task) => {
        normalizeTags(task.tags).forEach((tag) => {
          const key = tag.toLowerCase();
          if (!byKey.has(key)) byKey.set(key, tag);
        });
      });
      return [...byKey.values()].sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
    }

    function currentTagToken(input) {
      const beforeCursor = input.value.slice(0, input.selectionStart || input.value.length);
      const parts = beforeCursor.split(",");
      return parts[parts.length - 1].trim();
    }

    function applyTagSuggestion(input, tag) {
      const cursor = input.selectionStart || input.value.length;
      const tokenIndex = input.value.slice(0, cursor).split(",").length - 1;
      const parts = input.value.split(",");
      parts[tokenIndex] = tag;
      input.value = `${parts.map((part) => part.trim()).filter(Boolean).join(", ")}, `;
      input.focus();
      input.selectionStart = input.value.length;
      input.selectionEnd = input.value.length;
      updateTagAssist(input);
    }

    function tagAssistElements(input) {
      if (input === dialogTags) {
        return { preview: dialogTagsPreview, suggestions: dialogTagsSuggestions };
      }
      return { preview: tagsPreview, suggestions: tagsSuggestions };
    }

    function updateTagAssist(input) {
      const { preview, suggestions } = tagAssistElements(input);
      const tags = normalizeTags(input.value);
      const existing = knownTags();
      const existingKeys = new Set(existing.map((tag) => tag.toLowerCase()));
      preview.innerHTML = tags.map((tag) => {
        const isNew = !existingKeys.has(tag.toLowerCase());
        return `<span class="tag-chip ${isNew ? "new" : ""}">${isNew ? "Nueva: " : "#"}${escapeHtml(tag)}</span>`;
      }).join("");

      const token = currentTagToken(input).toLowerCase();
      const selectedKeys = new Set(tags.map((tag) => tag.toLowerCase()));
      const matches = token
        ? existing.filter((tag) => tag.toLowerCase().startsWith(token) && !selectedKeys.has(tag.toLowerCase())).slice(0, 6)
        : [];
      suggestions.innerHTML = matches.length
        ? matches.map((tag) => `<button class="tag-suggestion" type="button" data-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</button>`).join("")
        : `<span class="tag-empty">${token && !existingKeys.has(token) ? `Se creara "${escapeHtml(currentTagToken(input))}" al guardar` : ""}</span>`;
    }

    function parseSearch(value) {
      const spec = { terms: [], tags: [], priority: "", status: "" };
      String(value || "").split(/\s+/).filter(Boolean).forEach((part) => {
        const separator = part.indexOf(":");
        const key = separator > 0 ? part.slice(0, separator).toLowerCase() : "";
        const raw = separator > 0 ? part.slice(separator + 1).trim() : part;
        const text = raw.toLowerCase();
        if (!text) return;
        if (["tag", "tags", "#"].includes(key)) {
          spec.tags.push(text);
          return;
        }
        if (["priority", "prioridad", "importancia"].includes(key)) {
          spec.priority = text;
          return;
        }
        if (["status", "estado"].includes(key)) {
          spec.status = text;
          return;
        }
        spec.terms.push(part.toLowerCase());
      });
      return spec;
    }

    function matchesSearch(task, spec) {
      if (!spec.terms.length && !spec.tags.length && !spec.priority && !spec.status) return true;
      if (spec.priority && task.priority !== spec.priority) return false;
      if (spec.status && task.status !== spec.status) return false;
      const taskTags = normalizeTags(task.tags).map((tag) => tag.toLowerCase());
      if (spec.tags.some((tag) => !taskTags.includes(tag))) return false;
      const text = `${task.title} ${task.note || ""} ${task.detail || ""} ${tagsText(task.tags)} ${task.priority || ""} ${task.status || ""}`.toLowerCase();
      return spec.terms.every((term) => text.includes(term));
    }

    function nextRank(status) {
      const ranks = tasks.filter((task) => task.status === status).map((task) => task.rank || 0);
      return ranks.length ? Math.max(...ranks) + 100 : 100;
    }

    function addTask(event) {
      event.preventDefault();
      const title = titleInput.value.trim();
      if (!title) return;
      const status = statusInput.value;
      tasks.push({
        id: id(),
        title,
        note: noteInput.value.trim(),
        detail: newDetailInput.value.trim(),
        tags: normalizeTags(tagsInput.value),
        priority: validPriorities.includes(priorityInput.value) ? priorityInput.value : "media",
        status,
        rank: nextRank(status),
        createdAt: new Date().toISOString()
      });
      form.reset();
      priorityInput.value = "media";
      statusInput.value = "ahora";
      setSummaryVisibility(noteInput, toggleNewSummaryBtn, false);
      updateTagAssist(tagsInput);
      saveTasks();
      closeNewNoteDialog(true);
      render();
    }

    function getTask(idValue) {
      return tasks.find((task) => task.id === idValue);
    }

    function openTask(task) {
      activeTaskId = task.id;
      activeDialog = "task";
      detailMode = "summary";
      dialogTitle.value = task.title || "";
      dialogPriority.value = task.priority || "media";
      dialogStatus.value = task.status || "ahora";
      dialogNote.value = task.note || "";
      dialogTags.value = tagsText(task.tags);
      dialogDetail.value = task.detail || "";
      setSummaryVisibility(dialogNote, toggleDialogSummaryBtn, Boolean(dialogNote.value.trim()));
      taskDialog.classList.add("open");
      document.body.style.overflow = "hidden";
      history.pushState({ dialog: "task", id: task.id }, "", `#nota-${encodeURIComponent(task.id)}`);
      updateTagAssist(dialogTags);
      updateDetailPreview();
      dialogTitle.focus();
    }

    function closeTaskDialog(fromUser = false) {
      if (fromUser && activeDialog === "task" && history.state && history.state.dialog === "task") {
        history.back();
        return;
      }
      stopVoice();
      activeTaskId = null;
      activeDialog = "";
      taskDialog.classList.remove("open");
      document.body.style.overflow = "";
      if (location.hash.startsWith("#nota-")) history.replaceState({}, "", location.pathname + location.search);
    }

    function openNewNoteDialog() {
      activeDialog = "new";
      newNoteDialog.classList.add("open");
      document.body.style.overflow = "hidden";
      history.pushState({ dialog: "new" }, "", "#nueva-nota");
      setSummaryVisibility(noteInput, toggleNewSummaryBtn, Boolean(noteInput.value.trim()));
      updateTagAssist(tagsInput);
      titleInput.focus();
    }

    function closeNewNoteDialog(fromUser = false) {
      if (fromUser && activeDialog === "new" && history.state && history.state.dialog === "new") {
        history.back();
        return;
      }
      stopVoice();
      activeDialog = "";
      newNoteDialog.classList.remove("open");
      document.body.style.overflow = "";
      if (location.hash === "#nueva-nota") history.replaceState({}, "", location.pathname + location.search);
    }

    function activeTask() {
      return activeTaskId ? getTask(activeTaskId) : null;
    }

    function updateDetailPreview() {
      const syntheticTask = {
        note: dialogNote.value,
        detail: dialogDetail.value
      };
      if (detailMode === "summary") {
        detailPreview.hidden = false;
        dialogDetail.hidden = true;
        togglePreviewBtn.textContent = "Ver detalle";
        detailPreview.textContent = taskSummary(syntheticTask) || "Sin resumen";
        return;
      }
      detailPreview.hidden = true;
      dialogDetail.hidden = false;
      togglePreviewBtn.textContent = "Ver resumen";
    }

    function saveDialogTask() {
      const task = activeTask();
      if (!task) return;
      const title = dialogTitle.value.trim();
      if (!title) {
        alert("La nota necesita titulo.");
        return;
      }
      const previousStatus = task.status;
      task.title = title;
      task.priority = validPriorities.includes(dialogPriority.value) ? dialogPriority.value : "media";
      task.status = columns.some((column) => column.id === dialogStatus.value) ? dialogStatus.value : "ahora";
      task.note = dialogNote.value.trim();
      task.tags = normalizeTags(dialogTags.value);
      task.detail = dialogDetail.value.trim();
      if (task.status !== previousStatus) task.rank = nextRank(task.status);
      saveTasks();
      closeTaskDialog();
      render();
    }

    function deleteDialogTask() {
      const task = activeTask();
      if (!task || !confirm("Eliminar esta nota?")) return;
      tasks = tasks.filter((item) => item.id !== task.id);
      saveTasks();
      closeTaskDialog();
      render();
    }

    function normalizeTranscriptSegment(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function mergeTranscriptSegments(segments) {
      const words = [];
      segments.map(normalizeTranscriptSegment).filter(Boolean).forEach((segment) => {
        const nextWords = segment.split(" ");
        let overlap = Math.min(words.length, nextWords.length);
        while (overlap > 0) {
          const previousSlice = words.slice(words.length - overlap).join(" ").toLowerCase();
          const nextSlice = nextWords.slice(0, overlap).join(" ").toLowerCase();
          if (previousSlice === nextSlice) break;
          overlap -= 1;
        }
        words.push(...nextWords.slice(overlap));
      });
      return words.join(" ");
    }

    function startVoice(target, button) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("El dictado no esta disponible en este navegador.");
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = "es-ES";
      recognition.continuous = true;
      recognition.interimResults = true;
      voiceBaseDetail = target.value.trim();
      recognizing = true;
      button.classList.add("voice-active");
      button.textContent = "Parar";
      if (target === dialogDetail) {
        detailMode = "detail";
        updateDetailPreview();
      }
      recognition.onresult = (event) => {
        const segments = [];
        for (let index = 0; index < event.results.length; index += 1) {
          const transcript = normalizeTranscriptSegment(event.results[index][0].transcript);
          if (transcript) segments.push(transcript);
        }
        const dictated = mergeTranscriptSegments(segments);
        target.value = [voiceBaseDetail, dictated].filter(Boolean).join(voiceBaseDetail && dictated ? "\n" : "");
        if (target === dialogDetail) updateDetailPreview();
      };
      recognition.onend = () => {
        recognizing = false;
        button.classList.remove("voice-active");
        button.textContent = "Dictar";
      };
      recognition.start();
    }

    function stopVoice() {
      if (recognition && recognizing) recognition.stop();
      recognizing = false;
      voiceBtn.classList.remove("voice-active");
      voiceBtn.textContent = "Dictar";
      newVoiceBtn.classList.remove("voice-active");
      newVoiceBtn.textContent = "Dictar";
    }

    board.addEventListener("click", (event) => {
      if (event.target.closest(".priority-select")) return;
      const button = event.target.closest("button");
      const card = event.target.closest(".task");
      const task = card ? getTask(card.dataset.id) : null;
      if (!task) return;
      if (button && button.dataset.action === "delete") {
        event.stopPropagation();
        if (!confirm("Eliminar esta nota?")) return;
        tasks = tasks.filter((item) => item.id !== task.id);
        saveTasks();
        render();
        return;
      }
      openTask(task);
    });

    board.addEventListener("change", (event) => {
      if (!event.target.matches(".priority-select")) return;
      const card = event.target.closest(".task");
      const task = card ? getTask(card.dataset.id) : null;
      if (!task) return;
      event.stopPropagation();
      task.priority = validPriorities.includes(event.target.value) ? event.target.value : "media";
      saveTasks();
      render();
    });

    form.addEventListener("submit", addTask);
    newNoteBtn.addEventListener("click", openNewNoteDialog);
    document.querySelector("#closeNewNoteBtn").addEventListener("click", () => closeNewNoteDialog(true));
    document.querySelector("#cancelNewNoteBtn").addEventListener("click", () => closeNewNoteDialog(true));
    toggleNewSummaryBtn.addEventListener("click", () => toggleSummary(noteInput, toggleNewSummaryBtn));
    generateNewSummaryBtn.addEventListener("click", () => generateSummary(noteInput, newDetailInput, toggleNewSummaryBtn));
    [tagsInput, dialogTags].forEach((input) => {
      input.addEventListener("input", () => updateTagAssist(input));
      input.addEventListener("focus", () => updateTagAssist(input));
      input.addEventListener("keyup", () => updateTagAssist(input));
      input.addEventListener("click", () => updateTagAssist(input));
    });
    [tagsSuggestions, dialogTagsSuggestions].forEach((container) => {
      container.addEventListener("click", (event) => {
        const button = event.target.closest(".tag-suggestion");
        if (!button) return;
        applyTagSuggestion(container === dialogTagsSuggestions ? dialogTags : tagsInput, button.dataset.tag);
      });
    });
    search.addEventListener("input", () => {
      query = search.value.trim().toLowerCase();
      render();
    });

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        render();
      });
    });

    document.querySelector("#clearDoneBtn").addEventListener("click", () => {
      const done = tasks.filter((task) => task.status === "hecho").length;
      if (!done || !confirm(`Eliminar ${done} nota(s) completada(s)?`)) return;
      tasks = tasks.filter((task) => task.status !== "hecho");
      saveTasks();
      render();
    });

    document.querySelector("#closeDialogBtn").addEventListener("click", () => closeTaskDialog(true));
    document.querySelector("#cancelDialogBtn").addEventListener("click", () => closeTaskDialog(true));
    document.querySelector("#saveDialogBtn").addEventListener("click", saveDialogTask);
    document.querySelector("#deleteDialogBtn").addEventListener("click", deleteDialogTask);
    toggleDialogSummaryBtn.addEventListener("click", () => toggleSummary(dialogNote, toggleDialogSummaryBtn));
    generateDialogSummaryBtn.addEventListener("click", () => generateSummary(dialogNote, dialogDetail, toggleDialogSummaryBtn));
    togglePreviewBtn.addEventListener("click", () => {
      detailMode = detailMode === "summary" ? "detail" : "summary";
      updateDetailPreview();
    });
    voiceBtn.addEventListener("click", () => {
      if (recognizing) {
        stopVoice();
      } else {
        startVoice(dialogDetail, voiceBtn);
      }
    });
    newVoiceBtn.addEventListener("click", () => {
      if (recognizing) {
        stopVoice();
      } else {
        startVoice(newDetailInput, newVoiceBtn);
      }
    });
    dialogNote.addEventListener("input", updateDetailPreview);
    dialogDetail.addEventListener("input", updateDetailPreview);
    taskDialog.addEventListener("click", (event) => {
      if (event.target === taskDialog) closeTaskDialog(true);
    });
    newNoteDialog.addEventListener("click", (event) => {
      if (event.target === newNoteDialog) closeNewNoteDialog(true);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (taskDialog.classList.contains("open")) closeTaskDialog(true);
      if (newNoteDialog.classList.contains("open")) closeNewNoteDialog(true);
    });
    window.addEventListener("popstate", () => {
      if (taskDialog.classList.contains("open")) closeTaskDialog(false);
      if (newNoteDialog.classList.contains("open")) closeNewNoteDialog(false);
    });

    render();
    syncFromServer();
  </script>
</body>
</html>
